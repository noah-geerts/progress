name: Progress webapp CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - run: exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build react
        run: npm run build
